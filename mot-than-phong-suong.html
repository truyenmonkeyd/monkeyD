<script>

  const SHOPEE_LINK =
    "https://s.shopee.vn/2LXOs0571K";


  const STORY_LINK =
    "https://monkeydd.com/mot-than-phong-suong.html";


  const STORAGE_KEY =
    "mot_than_phong_suong_click_cycle_v2";


  /* =========================
     LẤY SỐ LẦN ĐÃ BẤM
  ========================== */

  function getClickCount() {

    const count =
      parseInt(
        localStorage.getItem(
          STORAGE_KEY
        ) || "0",
        10
      );

    return count;

  }


  /* =========================
     XỬ LÝ KHI BẤM
     
     1  -> SHOPEE
     2  -> MONKEYD
     3  -> MONKEYD
     4  -> SHOPEE
     5  -> MONKEYD
     6  -> MONKEYD
     ...
  ========================== */

  function handleMainClick(event) {

    event.preventDefault();


    let count =
      getClickCount() + 1;


    localStorage.setItem(
      STORAGE_KEY,
      count.toString()
    );


    /*
      Trong chu kỳ 3 lần:

      1, 4, 7, 10...
      sẽ mở Shopee.
    */

    const position =
      ((count - 1) % 3) + 1;


    if (position === 1) {

      /*
        LẦN 1:
        MỞ SHOPEE Ở TAB MỚI
      */

      window.open(
        SHOPEE_LINK,
        "_blank",
        "noopener,noreferrer"
      );


      /*
        Sau lần Shopee,
        đổi giao diện sang đọc truyện.
      */

      showStoryState();

    }

    else {

      /*
        LẦN 2 + LẦN 3:
        SANG MONKEYD
      */

      window.location.href =
        STORY_LINK;

    }

  }


  /* =========================
     GIAO DIỆN SAU LẦN SHOPEE
  ========================== */

  function showStoryState() {

    const instruction =
      document.getElementById(
        "instruction"
      );

    const shopeeButton =
      document.getElementById(
        "shopeeButton"
      );

    const storyButton =
      document.getElementById(
        "storyButton"
      );

    const readyMessage =
      document.getElementById(
        "readyMessage"
      );

    const imageNote =
      document.getElementById(
        "imageNote"
      );


    if (instruction) {

      instruction.style.display =
        "none";

    }


    if (shopeeButton) {

      shopeeButton.style.display =
        "none";

    }


    if (readyMessage) {

      readyMessage.style.display =
        "block";

    }


    if (storyButton) {

      storyButton.style.display =
        "flex";

    }


    if (imageNote) {

      imageNote.textContent =
        "Bấm vào ảnh để tiếp tục đọc truyện.";

    }

  }


  /* =========================
     GẮN CLICK CHO ẢNH + NÚT
  ========================== */

  const coverLink =
    document.getElementById(
      "coverLink"
    );


  const shopeeButton =
    document.getElementById(
      "shopeeButton"
    );


  const storyButton =
    document.getElementById(
      "storyButton"
    );


  if (coverLink) {

    coverLink.removeAttribute(
      "target"
    );

    coverLink.href = "#";

    coverLink.onclick =
      handleMainClick;

  }


  if (shopeeButton) {

    shopeeButton.removeAttribute(
      "target"
    );

    shopeeButton.href = "#";

    shopeeButton.onclick =
      handleMainClick;

  }


  if (storyButton) {

    storyButton.href = "#";

    storyButton.onclick =
      handleMainClick;

  }


  /* =========================
     KHI MỞ TRANG
  ========================== */

  function updatePage() {

    const count =
      getClickCount();


    /*
      Nếu lần vừa rồi là Shopee
      thì hiện nút đọc truyện.
    */

    if (
      count > 0 &&
      ((count - 1) % 3) + 1 === 1
    ) {

      showStoryState();

    }

  }


  window.addEventListener(
    "pageshow",
    updatePage
  );


  window.addEventListener(
    "focus",
    updatePage
  );


  updatePage();

</script>
