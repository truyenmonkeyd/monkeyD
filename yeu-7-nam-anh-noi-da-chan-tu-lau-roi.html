<script>

  /*
    SHOPEE RANDOM CHO BỘ NÀY
    THUỘC ĐÚNG 5 LINK CỐ ĐỊNH
  */

  const SHOPEE_LINK =
    "https://s.shopee.vn/7AcfKhyGAP";


  const STORY_LINK =
    "https://monkeydd.com/yeu-7-nam-anh-noi-da-chan-tu-lau-roi.html";


  /*
    KEY MỚI ĐỂ RESET VÒNG TEST
  */

  const STORAGE_KEY =
    "yeu_7_nam_visit_cycle_fixed_v2";


  /* =====================================
     ĐỌC SỐ LƯỢT
     localStorage + cookie dự phòng
  ===================================== */

  function getVisitCount() {

    try {

      const saved =
        localStorage.getItem(
          STORAGE_KEY
        );

      if (saved !== null) {

        return parseInt(
          saved,
          10
        ) || 0;

      }

    } catch (error) {}



    const cookieName =
      STORAGE_KEY + "=";


    const cookies =
      document.cookie.split(";");


    for (
      let i = 0;
      i < cookies.length;
      i++
    ) {

      let cookie =
        cookies[i].trim();


      if (
        cookie.indexOf(
          cookieName
        ) === 0
      ) {

        return parseInt(
          cookie.substring(
            cookieName.length
          ),
          10
        ) || 0;

      }

    }


    return 0;

  }


  /* =====================================
     LƯU SỐ LƯỢT
  ===================================== */

  function saveVisitCount(count) {

    try {

      localStorage.setItem(
        STORAGE_KEY,
        count.toString()
      );

    } catch (error) {}


    document.cookie =
      STORAGE_KEY +
      "=" +
      count +
      "; max-age=31536000; path=/; SameSite=Lax";

  }


  /* =====================================
     +1 LƯỢT
  ===================================== */

  function registerVisit() {

    const newCount =
      getVisitCount() + 1;


    saveVisitCount(
      newCount
    );


    return newCount;

  }


  /* =====================================
     CHU KỲ

     1 = SHOPEE
     2 = MONKEYD
     3 = MONKEYD

     4 = SHOPEE
     5 = MONKEYD
     6 = MONKEYD
     ...
  ===================================== */

  function getPosition(count) {

    return (
      ((count - 1) % 3) + 1
    );

  }


  /* =====================================
     GIAO DIỆN SHOPEE
  ===================================== */

  function showShopeeState() {

    const instruction =
      document.getElementById(
        "instruction"
      );


    const ready =
      document.getElementById(
        "readyMessage"
      );


    const shopeeButton =
      document.getElementById(
        "shopeeButton"
      );


    const storyButton =
      document.getElementById(
        "storyButton"
      );


    const cover =
      document.getElementById(
        "coverLink"
      );


    const imageNote =
      document.getElementById(
        "imageNote"
      );


    instruction.style.display =
      "block";


    ready.style.display =
      "none";


    shopeeButton.style.display =
      "flex";


    storyButton.style.display =
      "none";


    imageNote.textContent =
      "Bạn có thể bấm trực tiếp vào ảnh.";


    /* ẢNH -> SHOPEE */

    cover.href =
      SHOPEE_LINK;


    cover.target =
      "_blank";


    cover.rel =
      "noopener noreferrer";


    cover.onclick =
      afterShopeeClick;


    /* NÚT -> SHOPEE */

    shopeeButton.href =
      SHOPEE_LINK;


    shopeeButton.target =
      "_blank";


    shopeeButton.rel =
      "noopener noreferrer";


    shopeeButton.onclick =
      afterShopeeClick;

  }


  /* =====================================
     GIAO DIỆN MONKEYD
  ===================================== */

  function showStoryState() {

    const instruction =
      document.getElementById(
        "instruction"
      );


    const ready =
      document.getElementById(
        "readyMessage"
      );


    const shopeeButton =
      document.getElementById(
        "shopeeButton"
      );


    const storyButton =
      document.getElementById(
        "storyButton"
      );


    const cover =
      document.getElementById(
        "coverLink"
      );


    const imageNote =
      document.getElementById(
        "imageNote"
      );


    instruction.style.display =
      "none";


    ready.style.display =
      "block";


    ready.innerHTML =
      "✓ Nội dung đã sẵn sàng.<br>Bạn có thể tiếp tục đọc truyện.";


    shopeeButton.style.display =
      "none";


    storyButton.style.display =
      "flex";


    imageNote.textContent =
      "Bấm vào ảnh để tiếp tục đọc truyện.";


    /* ẢNH -> MONKEYD */

    cover.href =
      STORY_LINK;


    cover.removeAttribute(
      "target"
    );


    cover.removeAttribute(
      "rel"
    );


    cover.onclick =
      null;


    /* NÚT -> MONKEYD */

    storyButton.href =
      STORY_LINK;


    storyButton.removeAttribute(
      "target"
    );

  }


  /* =====================================
     SAU KHI BẤM SHOPEE

     KHÔNG +1 LƯỢT.

     Chỉ đổi tab hiện tại
     sang trạng thái đọc truyện.
  ===================================== */

  function afterShopeeClick() {

    setTimeout(
      function () {

        showStoryState();

      },
      200
    );

  }


  /* =====================================
     BẮT ĐẦU MỘT LƯỢT MỚI
  ===================================== */

  function startVisit() {

    const visit =
      registerVisit();


    const position =
      getPosition(
        visit
      );


    console.log(
      "Lượt hiện tại:",
      visit
    );


    console.log(
      "Vị trí chu kỳ:",
      position
    );


    /*
      1 / 4 / 7 / 10...
      -> SHOPEE
    */

    if (
      position === 1
    ) {

      showShopeeState();

    }


    /*
      2 / 3
      5 / 6
      8 / 9...
      -> MONKEYD
    */

    else {

      showStoryState();

    }

  }


  /* =====================================
     QUAN TRỌNG

     pageshow chạy:
     - mở trang lần đầu
     - reload
     - quay Back từ MonkeyD

     => vòng không bị đứng nữa.
  ===================================== */

  window.addEventListener(
    "pageshow",
    function () {

      startVisit();

    }
  );

</script>
