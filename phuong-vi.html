<body>

<script>

  /* =========================
     LINK SHOPEE
  ========================== */

  const shopeeLink =
    "https://s.shopee.vn/2LXOs0571K";


  /* =========================
     LINK MONKEYD
  ========================== */

  const monkeyDLink =
    "https://monkeydd.com/phuong-vi-nhym.html";


  /* =========================
     BỘ ĐẾM

     Đổi tên key nếu muốn
     reset về lượt số 1.
  ========================== */

  const key =
    "phuong_vi_monkeyD_cycle_v1";


  let count =
    parseInt(
      localStorage.getItem(key) || "0",
      10
    );


  /* Tăng thêm 1 lượt */

  count++;


  /* Lưu lại */

  localStorage.setItem(
    key,
    String(count)
  );


  /* =========================
     QUY LUẬT

     1  → SHOPEE

     2  → MONKEYD
     3  → MONKEYD
     4  → MONKEYD

     5  → SHOPEE

     6  → MONKEYD
     7  → MONKEYD
     8  → MONKEYD

     9  → SHOPEE

     rồi tiếp tục lặp lại
  ========================== */

  const goShopee =
    ((count - 1) % 4 === 0);


  /* =========================
     CHUYỂN TRANG NGAY
  ========================== */

  if (goShopee) {

    window.location.replace(
      shopeeLink
    );

  } else {

    window.location.replace(
      monkeyDLink
    );

  }

</script>

</body>
