<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PHƯỢNG VỊ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 24px;

      font-family: "Georgia", "Times New Roman", serif;

      background:
        linear-gradient(
          135deg,
          #fff8f5,
          #fbeeee
        );

      color: #4a3434;
    }

    .card {
      width: 100%;
      max-width: 520px;

      background: rgba(255, 255, 255, 0.94);

      padding: 38px 28px;

      border-radius: 22px;

      box-shadow:
        0 12px 35px rgba(110, 70, 70, 0.12);

      text-align: center;

      border: 1px solid #f2dddd;
    }

    .decoration {
      font-size: 22px;
      margin-bottom: 12px;
      color: #b77b7b;
    }

    h1 {
      margin: 0;

      font-size: 32px;
      letter-spacing: 3px;

      color: #6d4141;
    }

    .subtitle {
      margin-top: 10px;
      margin-bottom: 28px;

      font-size: 13px;
      letter-spacing: 2px;

      color: #a47b7b;
    }

    .line {
      width: 65px;
      height: 2px;

      background: #d9b0b0;

      margin: 0 auto 28px;
      border-radius: 10px;
    }

    .message {
      font-family: Arial, Helvetica, sans-serif;

      font-size: 17px;
      line-height: 1.8;

      color: #544444;
    }

    .message strong {
      color: #ee4d2d;
    }

    .shopee-button {
      display: block;

      margin-top: 28px;

      padding: 15px 22px;

      border-radius: 50px;

      background: #ee4d2d;
      color: white;

      text-decoration: none;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 16px;
      font-weight: bold;

      box-shadow:
        0 8px 20px rgba(238, 77, 45, 0.22);

      transition: 0.2s;
    }

    .shopee-button:hover {
      transform: translateY(-2px);
    }

    .link-text {
      margin-top: 17px;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 12px;

      color: #ad9292;

      word-break: break-all;
    }

    .footer {
      margin-top: 30px;

      font-size: 12px;
      color: #b9a1a1;
    }

    @media (max-width: 520px) {

      body {
        padding: 16px;
      }

      .card {
        padding: 32px 21px;
      }

      h1 {
        font-size: 27px;
      }

      .message {
        font-size: 16px;
      }

    }
  </style>
</head>

<body>

  <div class="card">

    <div class="decoration">
      ✦ ❀ ✦
    </div>

    <h1>PHƯỢNG VỊ</h1>

    <div class="subtitle">
      TRUYỆN ĐÃ HOÀN THÀNH
    </div>

    <div class="line"></div>

    <div class="message">

      Mời bạn click vào liên kết bên dưới và
      <br>

      <strong>MỞ ỨNG DỤNG SHOPEE</strong>
      <br>

      để tiếp tục.

    </div>

    <a
      class="shopee-button"
      href="https://s.shopee.vn/2LXOs0571K">
      MỞ SHOPEE
    </a>

    <div class="link-text">
      https://s.shopee.vn/2LXOs0571K
    </div>

    <div class="footer">
      ✧ Cảm ơn bạn đã ghé đọc truyện ✧
    </div>

  </div>

</body>
</html>
