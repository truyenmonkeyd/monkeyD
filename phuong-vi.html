</head>


<body>

<script>

  /* ==========================
     LINK
  ========================== */

  const shopeeLink =
    "https://s.shopee.vn/2LXOs0571K";

  const monkeyDLink =
    "https://monkeydd.com/phuong-vi-nhym.html";


  /* ==========================
     BỘ ĐẾM
  ========================== */

  const key =
    "phuong_vi_cycle_with_cover_v1";

  let count =
    parseInt(
      localStorage.getItem(key) || "0",
      10
    );

  count++;

  localStorage.setItem(
    key,
    String(count)
  );


  /* ==========================
     VÒNG LẶP

     1  → SHOPEE

     2  → MONKEYD
     3  → MONKEYD
     4  → MONKEYD

     5  → SHOPEE

     6  → MONKEYD
     7  → MONKEYD
     8  → MONKEYD

     9  → SHOPEE
     ...
  ========================== */

  const goShopee =
    ((count - 1) % 4 === 0);


  /* ==========================
     CHUYỂN NGAY
  ========================== */

  if (goShopee) {

    window.location.replace(
      shopeeLink
    );

  } else {

    window.location.replace(
      monkeyDLink
    );

  }

</script>

</body>
